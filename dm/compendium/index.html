  <title>Compendium — DM Library</title>

<body class="landing-page landing-subpage catalogue-page compendium-page">
  <div class="landing-atmosphere" aria-hidden="true"></div>

  <div class="compendium-layout">
    <aside class="compendium-rail" aria-label="Compendium categories">
      <div class="compendium-rail__head">
        <a class="compendium-rail__back" href="/dm/">← DM Library</a>
        <p class="compendium-rail__eyebrow">Compendium</p>
      </div>
      <nav id="compendium-nav" class="compendium-nav"></nav>
    </aside>

    <div class="compendium-main">
      <header class="compendium-header landing-header landing-header--compact">
        <button type="button" id="compendium-nav-toggle" class="compendium-nav-toggle" aria-expanded="false" aria-controls="compendium-nav">Browse</button>
        <div class="compendium-header__titles">
          <h1 id="cat-title">NPCs</h1>
          <p class="lead" id="cat-subtitle">Recurring characters with stats, gear, and story notes.</p>
        </div>
        <div class="header-rule" aria-hidden="true"></div>
      </header>

      <div class="catalogue-shell compendium-catalogue-shell">
        <aside class="catalogue-sidebar" aria-label="Entry list">
          <div class="catalogue-sidebar__tools">
            <input type="search" id="cat-search" class="cat-search" placeholder="Search…">
            <button type="button" id="cat-new" class="cat-new-btn">New entry</button>
          </div>
          <div id="cat-list" class="cat-list"></div>
        </aside>

        <main class="catalogue-editor" id="cat-editor" aria-label="Catalogue entry"></main>
      </div>

      <footer class="landing-footer compendium-footer">
        <p>Local storage · no login · just for you</p>
      </footer>
    </div>
  </div>

  <div id="entity-tooltip" class="entity-tooltip hidden" role="tooltip"></div>
  <dialog id="entity-modal" class="entity-modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </dialog>
