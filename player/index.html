<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.png?v=20260825f2" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Player Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/player.css">
</head>
<body class="player-body">
  <div id="app">
    <section id="view-login" class="view view-login" hidden>
      <header class="hero">
        <p class="brand">Stormwreck</p>
        <h1>Player companion</h1>
        <p class="lede">Your character sheet for play at the table.</p>
      </header>
      <form id="login-form" class="stack-form login-card panel">
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error" hidden></p>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </section>

    <section id="view-campaigns" class="view" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Signed in</p>
          <h1>Campaigns</h1>
        </div>
        <button type="button" class="btn btn-ghost" id="logout-campaigns">Log out</button>
      </header>
      <ul id="campaign-list" class="list"></ul>
    </section>

    <section id="view-shell" class="view view-shell" hidden>
      <header class="topbar">
        <div>
          <p id="shell-campaign" class="eyebrow"></p>
          <h1 id="shell-title">Companion</h1>
        </div>
        <button type="button" class="btn btn-ghost" id="logout-shell">Log out</button>
      </header>
      <div id="char-switcher" class="switcher" hidden></div>
      <main id="main"></main>
      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab is-active" data-tab="characters">Sheet</button>
        <button type="button" class="tab" data-tab="party">Party</button>
        <button type="button" class="tab" data-tab="people">People</button>
        <button type="button" class="tab" data-tab="library">Library</button>
        <button type="button" class="tab" data-tab="notes">Notes</button>
      </nav>
    </section>
  </div>

  <dialog id="detail-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <header>
        <h2 id="detail-title"></h2>
        <button value="close" class="btn btn-ghost">Close</button>
      </header>
      <div id="detail-body" class="dialog-body"></div>
    </form>
  </dialog>

  <dialog id="note-dialog" class="dialog dialog-note">
    <form id="note-form" class="dialog-inner stack-form">
      <header>
        <h2 id="note-dialog-title">New note</h2>
        <button type="button" class="btn btn-ghost" id="note-cancel">Cancel</button>
      </header>
      <div class="dialog-body">
        <p id="note-timestamps" class="meta" hidden></p>
        <label>Title<input name="title" required maxlength="200"></label>
        <label>Body<textarea name="body" required></textarea></label>
        <label>Character (optional)
          <select name="characterId">
            <option value="">Campaign note</option>
          </select>
        </label>
        <div class="row" id="note-actions">
          <button class="btn btn-primary" type="submit">Save</button>
          <button type="button" class="btn btn-danger" id="note-delete" hidden>Delete</button>
        </div>
        <div id="note-confirm-delete" class="confirm-box" hidden>
          <p>Delete this note? This cannot be undone.</p>
          <div class="row">
            <button type="button" class="btn btn-danger" id="note-confirm-yes">Delete</button>
            <button type="button" class="btn btn-ghost" id="note-confirm-no">Keep note</button>
          </div>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="sheet-dialog" class="dialog dialog-note dialog-sheet">
    <form id="sheet-form" class="dialog-inner stack-form">
      <header>
        <h2>Edit character</h2>
        <button type="button" class="btn btn-ghost" id="sheet-cancel">Cancel</button>
      </header>
      <div class="dialog-body">
        <label>Name<input name="name" required maxlength="120"></label>
        <label>Portrait
          <input type="file" name="portrait" accept="image/*">
        </label>
        <div class="form-grid">
          <label>Race<input name="race" maxlength="120"></label>
          <label>Class<input name="class" maxlength="120"></label>
          <label>Subclass<input name="subclass" maxlength="120"></label>
          <label>Level<input name="level" type="number" min="1" max="30" step="1"></label>
        </div>
        <div class="form-grid">
          <label>Background<input name="background" maxlength="120"></label>
          <label>Alignment<input name="alignment" maxlength="80"></label>
        </div>
        <p class="sheet-form-heading">Abilities</p>
        <div class="form-grid form-grid-6">
          <label>STR<input name="str" type="number" min="1" max="30"></label>
          <label>DEX<input name="dex" type="number" min="1" max="30"></label>
          <label>CON<input name="con" type="number" min="1" max="30"></label>
          <label>INT<input name="int" type="number" min="1" max="30"></label>
          <label>WIS<input name="wis" type="number" min="1" max="30"></label>
          <label>CHA<input name="cha" type="number" min="1" max="30"></label>
        </div>
        <p class="sheet-form-heading">Combat</p>
        <div class="form-grid">
          <label>AC<input name="ac" type="number" min="0" max="40"></label>
          <label>Speed<input name="speed" maxlength="40"></label>
          <label>Proficiency<input name="proficiencyBonus" maxlength="20"></label>
          <label>Hit dice<input name="hitDice" maxlength="40"></label>
        </div>
        <div class="form-grid">
          <label>HP current<input name="hpCurrent" type="number"></label>
          <label>HP max<input name="hpMax" type="number" min="1"></label>
          <label>Temp HP<input name="hpTemp" type="number" min="0"></label>
        </div>
        <p class="sheet-form-heading">Currency</p>
        <div class="form-grid form-grid-5">
          <label>CP<input name="cp" type="number" min="0" step="1"></label>
          <label>SP<input name="sp" type="number" min="0" step="1"></label>
          <label>EP<input name="ep" type="number" min="0" step="1"></label>
          <label>GP<input name="gp" type="number" min="0" step="1"></label>
          <label>PP<input name="pp" type="number" min="0" step="1"></label>
        </div>
        <label>Skills (one per line; use @skill:id|Label for catalogue links)
          <textarea name="skillRefs" rows="4"></textarea>
        </label>
        <label>Features (one per line)
          <textarea name="featureRefs" rows="4"></textarea>
        </label>
        <label>Spells (one per line)
          <textarea name="spellRefs" rows="4"></textarea>
        </label>
        <div class="row" id="sheet-actions">
          <button class="btn btn-primary" type="submit">Save sheet</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="add-dialog" class="dialog dialog-note dialog-add">
    <form id="add-form" class="dialog-inner stack-form">
      <header>
        <h2 id="add-dialog-title">Add</h2>
        <button type="button" class="btn btn-ghost" id="add-cancel">Cancel</button>
      </header>
      <div class="dialog-body">
        <div id="add-catalogue-panel">
          <label>Search catalogue
            <input type="search" id="add-search" name="q" autocomplete="off" placeholder="Type to search…">
          </label>
          <ul id="add-results" class="add-results" role="listbox"></ul>
          <p id="add-empty" class="empty" hidden>No matches.</p>
          <div class="row add-custom-row">
            <button type="button" class="btn btn-ghost" id="add-custom" hidden>Add as custom text</button>
          </div>
        </div>
        <div id="add-condition-panel" hidden>
          <label>Condition
            <input name="condition" id="add-condition-input" maxlength="80" autocomplete="off" placeholder="e.g. prone">
          </label>
          <div class="row">
            <button class="btn btn-primary" type="submit">Add condition</button>
          </div>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="create-character-dialog" class="dialog dialog-note">
    <form id="create-character-form" class="dialog-inner stack-form">
      <div class="dialog-head">
        <h2 id="create-character-title">Create character</h2>
        <button type="button" class="btn btn-ghost" id="create-character-cancel">Cancel</button>
      </div>
      <div class="dialog-body">
        <label class="field">
          <span>Name</span>
          <input name="name" id="create-character-name" required maxlength="80" autocomplete="off" placeholder="Character name">
        </label>
        <div class="row">
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="/js/core/catalogue/types.js"></script>
  <script src="/js/core/parser.js"></script>
  <script src="/js/core/source-ui.js"></script>
  <script src="/js/core/player-api-client.js"></script>
  <script src="/js/player-app.js"></script>
</body>
</html>
